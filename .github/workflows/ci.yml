name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    # The image and PDF scripts differ per system: sips and PDFKit on macOS, file and poppler on Linux, PowerShell and Windows.Data.Pdf on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - if: runner.os != 'Windows'
        run: node --test
      # Herdr's PATH on Windows has none of Git's tools, whatever this runner has.
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          node --test

  herdr:
    name: Herdr mod requirements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Static checks only: `herdr-app check` needs the desktop app and runs locally (release-check skill).
      - run: node scripts/check-herdr.mjs
